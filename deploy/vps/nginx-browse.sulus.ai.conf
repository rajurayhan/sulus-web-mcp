# sulus-web-mcp — nginx for browse.sulus.ai
#
# Upstream: Docker Compose publishes 127.0.0.1:3100 → container :3000
# Install:
#   sudo cp deploy/vps/nginx-browse.sulus.ai.conf /etc/nginx/sites-available/browse.sulus.ai
#   sudo ln -sf /etc/nginx/sites-available/browse.sulus.ai /etc/nginx/sites-enabled/browse.sulus.ai
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS: A/AAAA for browse.sulus.ai → this server
# TLS (after HTTP proxy works):
#   sudo certbot --nginx -d browse.sulus.ai

upstream sulus_web_mcp {
    server 127.0.0.1:3100;
    keepalive 8;
}

# --- HTTP (first bring-up / certbot; then prefer HTTPS redirect) ---
server {
    listen 80;
    listen [::]:80;
    server_name browse.sulus.ai;

    # Health is unauthenticated — keep it cheap and unbuffered
    location /health {
        proxy_pass http://sulus_web_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 10s;
    }

    # MCP Streamable HTTP — disable buffering for long-lived / chunked responses
    location /mcp {
        proxy_pass http://sulus_web_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_request_buffering off;
    }

    location / {
        return 404;
    }
}

