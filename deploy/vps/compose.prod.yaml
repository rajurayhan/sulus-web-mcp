# Overlay for VPS: bind loopback only so Chromium MCP is not public.
# Used as:
#   docker compose -f compose.yaml -f deploy/vps/compose.prod.yaml up -d --build
#
# MCP_PORT in .env is the host port (default 3100). Container still listens on 3000.

services:
  web-mcp:
    ports:
      - "127.0.0.1:${MCP_PORT:-3100}:3000"
